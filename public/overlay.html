<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lorcana Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Lorcana palette ── */
      --gold:        #d3ba84;   /* Illuminary Gold — secondary */
      --parchment:   #e3caa8;   /* Parchment — tertiary */
      --parchment-l: #f0dfc8;   /* lighter parchment */
      --purple:      #2A275C;
      --purple-deep: #1a1840;
      --purple-mid:  #322f6e;
      --beige:       #e3caa8;
      --beige-l:     #f0dfc8;
      --beige-d:     #d3ba84;
      --beige-dim:   rgba(227, 202, 168, 0.55);
      --glow-beige:  rgba(227, 202, 168, 0.25);
      --text:        #f0dfc8;
      --muted:       rgba(227, 202, 168, 0.50);
    }

    html, body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: 'Chakra Petch', monospace;
    }

    .overlay {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      position: relative;
    }

    /* ── Player panels ── */
    .player-panel {
      width: 320px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 26px 0 26px;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    /* Gradient background — atmospheric radial spotlight at inner top corner */
    .player-panel.p1 {
      background:
        radial-gradient(ellipse 170% 45% at 0% 0%, rgba(72, 64, 158, 0.52) 0%, transparent 60%),
        radial-gradient(ellipse 100% 22% at 50% 100%, rgba(10, 8, 30, 0.65) 0%, transparent 68%),
        linear-gradient(180deg,
          rgba(54, 51, 118, 0.97) 0%,
          rgba(43, 40, 95, 0.96) 32%,
          rgba(31, 28, 76, 0.97) 62%,
          rgba(20, 18, 50, 0.99) 100%);
      border-right: 1px solid rgba(227, 202, 168, 0.22);
      padding-right: 58px;
      box-shadow:
        inset -6px 0 30px rgba(227, 202, 168, 0.07),
        inset 0 -80px 60px rgba(232, 213, 163, 0.04);
    }
    .player-panel.p2 {
      background:
        radial-gradient(ellipse 170% 45% at 100% 0%, rgba(72, 64, 158, 0.52) 0%, transparent 60%),
        radial-gradient(ellipse 100% 22% at 50% 100%, rgba(10, 8, 30, 0.65) 0%, transparent 68%),
        linear-gradient(180deg,
          rgba(54, 51, 118, 0.97) 0%,
          rgba(43, 40, 95, 0.96) 32%,
          rgba(31, 28, 76, 0.97) 62%,
          rgba(20, 18, 50, 0.99) 100%);
      border-left: 1px solid rgba(227, 202, 168, 0.22);
      padding-left: 58px;
      box-shadow:
        inset 6px 0 30px rgba(227, 202, 168, 0.07),
        inset 0 -80px 60px rgba(232, 213, 163, 0.04);
    }

    /* Top accent bar — Illuminary Gold, 4px with 3-layer glow */
    .player-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(211, 186, 132, 0.3) 12%,
        rgba(211, 186, 132, 0.65) 30%,
        #d3ba84 50%,
        rgba(211, 186, 132, 0.65) 70%,
        rgba(211, 186, 132, 0.3) 88%,
        transparent 100%);
      box-shadow:
        0 0 8px rgba(211, 186, 132, 0.65),
        0 0 22px rgba(211, 186, 132, 0.30),
        0 0 50px rgba(211, 186, 132, 0.10);
    }

    /* Bottom accent bar */
    .player-panel::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(227, 202, 168, 0.28) 20%,
        rgba(227, 202, 168, 0.55) 45%,
        var(--parchment) 50%,
        rgba(227, 202, 168, 0.55) 55%,
        rgba(227, 202, 168, 0.28) 80%,
        transparent 100%);
      box-shadow:
        0 0 10px rgba(227, 202, 168, 0.30),
        0 0 28px rgba(227, 202, 168, 0.10);
    }

    /* Winner state */
    .player-panel.winner {
      background:
        radial-gradient(ellipse 170% 45% at 0% 0%, rgba(90, 80, 175, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse 100% 22% at 50% 100%, rgba(10, 8, 30, 0.75) 0%, transparent 68%),
        linear-gradient(180deg,
          rgba(56, 53, 122, 0.98) 0%,
          rgba(43, 40, 95, 0.97) 32%,
          rgba(31, 28, 76, 0.98) 62%,
          rgba(20, 18, 50, 1.00) 100%);
    }
    .player-panel.p2.winner {
      background:
        radial-gradient(ellipse 170% 45% at 100% 0%, rgba(90, 80, 175, 0.55) 0%, transparent 60%),
        radial-gradient(ellipse 100% 22% at 50% 100%, rgba(10, 8, 30, 0.75) 0%, transparent 68%),
        linear-gradient(180deg,
          rgba(56, 53, 122, 0.98) 0%,
          rgba(43, 40, 95, 0.97) 32%,
          rgba(31, 28, 76, 0.98) 62%,
          rgba(20, 18, 50, 1.00) 100%);
    }
    .player-panel.winner::before {
      height: 4px;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--gold) 12%,
        var(--parchment-l) 38%,
        #fdf5e8 50%,
        var(--parchment-l) 62%,
        var(--gold) 88%,
        transparent 100%);
      box-shadow:
        0 0 14px rgba(240, 223, 200, 0.95),
        0 0 32px rgba(211, 186, 132, 0.60),
        0 0 70px rgba(211, 186, 132, 0.22);
      animation: shimmer-line 1.8s ease-in-out infinite;
    }

    @keyframes shimmer-line {
      0%   { opacity: 0.75; }
      50%  { opacity: 1; }
      100% { opacity: 0.75; }
    }

    /* ── Header ── */
    .panel-header {
      position: relative;
      z-index: 1;
      padding: 0 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .p2 .panel-header { text-align: right; }
    .p2 .wins-row { justify-content: flex-end; }

    .player-label {
      font-family: 'Jost', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(211, 186, 132, 0.45);
    }

    .player-name {
      font-family: 'Jost', sans-serif;
      font-weight: 800;
      font-size: 34px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
    }

    /* Divider under name */
    .name-divider {
      height: 1px;
      background: linear-gradient(90deg,
        rgba(211, 186, 132, 0.75) 0%,
        rgba(227, 202, 168, 0.30) 55%,
        transparent 100%);
    }
    .p2 .name-divider {
      background: linear-gradient(270deg,
        rgba(211, 186, 132, 0.75) 0%,
        rgba(227, 202, 168, 0.30) 55%,
        transparent 100%);
    }

    .wins-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wins-label {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .win-pips { display: flex; gap: 7px; }

    .pip {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 2px solid rgba(211, 186, 132, 0.55);
      background: transparent;
      transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
    }

    .pip.filled {
      background: radial-gradient(circle, var(--parchment-l) 0%, var(--gold) 100%);
      border-color: rgba(227, 202, 168, 0.72);
      box-shadow:
        0 0 8px var(--gold),
        0 0 20px rgba(211, 186, 132, 0.55),
        0 0 38px rgba(211, 186, 132, 0.20);
    }

    /* ── Panel body ── */
    .panel-body { flex: 1; min-height: 0; }

    /* ── Full-height beige ladder ── */
    .ladder {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 54px;
      display: flex;
      flex-direction: column-reverse;
      gap: 1px;
      padding: 0;
      /* richer gradient: deeper gold at edges, warm parchment through the middle */
      background: linear-gradient(180deg,
        #c0a060 0%,
        #d3ba84 8%,
        #dbc896 22%,
        #e3caa8 42%,
        #eddfc4 58%,
        #e8d8b8 75%,
        #dbc896 90%,
        #c4a668 100%);
    }

    .p1 .ladder { right: 0; }
    .p2 .ladder { left: 0; }

    .rung {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: background 0.2s ease;
    }

    .rung-num {
      font-family: 'Jost', sans-serif;
      font-weight: 800;
      font-size: 19px;
      line-height: 1;
      color: rgba(42, 39, 92, 0.35);
      transition: color 0.2s ease, font-size 0.15s ease;
      user-select: none;
    }

    /* ── Rung states ── */

    .rung.past .rung-num {
      color: rgba(42, 39, 92, 0.62);
    }

    /* current rung: light parchment block — clearly visible at all positions */
    .rung.current {
      background: var(--parchment-l);
      box-shadow: 0 0 8px rgba(211, 186, 132, 0.4), 0 0 20px rgba(211, 186, 132, 0.15);
      flex: 1.4;
    }
    .rung.current .rung-num {
      font-size: 36px;
      color: #1a1840;
      text-shadow: none;
    }

    .p1 .rung.current { border-left:  3px solid #a8864a; }
    .p2 .rung.current { border-right: 3px solid #a8864a; }

/* near-win 15+ — deep purple escalation with gold glow */
    .rung.past.near-win .rung-num {
      color: #2A275C;
    }
    .rung.current.near-win {
      background: var(--parchment-l);
      box-shadow: 0 0 10px rgba(211, 186, 132, 0.55), 0 0 24px rgba(211, 186, 132, 0.20);
    }
    .rung.current.near-win .rung-num {
      font-size: 36px;
      color: #1a1840;
      text-shadow: none;
    }

    /* winner / max */
    .rung.max             { background: rgba(42, 39, 92, 0.08); }
    .rung.max .rung-num   { color: #2A275C; }
    .rung.current.max {
      background: var(--purple-deep);
      animation: pulse-rung 1s ease-in-out infinite;
    }
    .rung.current.max .rung-num {
      font-size: 36px;
      color: var(--parchment-l);
      text-shadow: 0 0 12px rgba(227, 202, 168, 1);
    }

    @keyframes pulse-rung {
      0%, 100% { box-shadow: 0 0 12px rgba(227, 202, 168, 0.4), 0 0 30px rgba(227, 202, 168, 0.15); }
      50%       { box-shadow: 0 0 26px rgba(227, 202, 168, 0.9), 0 0 60px rgba(211, 186, 132, 0.45), 0 0 90px rgba(227, 202, 168, 0.15); }
    }

    /* ── Rung slide-in on lore change ── */
    @keyframes enter-from-below {
      from { transform: translateY(14px); }
      to   { transform: translateY(0); }
    }
    @keyframes enter-from-above {
      from { transform: translateY(-14px); }
      to   { transform: translateY(0); }
    }

    /* These come after .rung.current so they win the animation override */
    .rung.enter-up   { animation: enter-from-below 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .rung.enter-down { animation: enter-from-above 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* ── Winner badge ── */
    .winner-badge {
      position: relative;
      z-index: 1;
      display: none;
      font-family: 'Jost', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--beige-l);
      text-shadow:
        0 0 10px var(--beige-d),
        0 0 25px rgba(201, 169, 110, 0.5);
      text-align: center;
      padding: 0 14px;
      animation: pulse-text 1.2s ease-in-out infinite;
    }

    .player-panel.winner .winner-badge { display: block; }

    @keyframes pulse-text {
      0%, 100% { opacity: 1; text-shadow: 0 0 10px var(--gold), 0 0 25px rgba(211,186,132,0.5); }
      50%       { opacity: 0.7; text-shadow: 0 0 20px var(--parchment), 0 0 40px rgba(227,202,168,0.6); }
    }

    /* ── Venue tag ── */
    .venue-tag {
      position: absolute;
      bottom: 12px;
      left: calc(50% + 95px);
      right: 320px;
      text-align: center;
      font-family: 'Jost', sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 2px;
      color: rgba(227, 202, 168, 0.72);
      white-space: nowrap;
      text-transform: uppercase;
    }

    /* ── Social ticker ── */
    .social-ticker {
      position: absolute;
      bottom: 0;
      left: 320px;
      width: calc(50% - 415px);
      height: 50px;
      overflow: hidden;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      padding-bottom: 12px;
    }

    .social-ticker-track {
      display: flex;
      align-items: center;
      gap: 0;
      white-space: nowrap;
      animation: ticker-scroll 22s linear infinite;
    }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    .ticker-handle {
      font-family: 'Jost', sans-serif;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 2px;
      color: rgba(227, 202, 168, 0.72);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ticker-handle svg { opacity: 0.5; flex-shrink: 0; }

    .ticker-sep {
      color: var(--gold);
      opacity: 0.4;
      font-size: 12px;
      margin: 0 22px;
    }

    /* ── Round Timer — center bottom ── */
    .round-timer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      background: linear-gradient(90deg,
        #cdb07a 0%,
        #dbc896 10%,
        #eddfc4 50%,
        #dbc896 90%,
        #cdb07a 100%);
      height: 54px;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }


    .round-timer.hidden { display: none; }

    .timer-digits {
      font-family: 'Jost', sans-serif;
      font-weight: 800;
      font-size: 34px;
      line-height: 1;
      color: #1a1840;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
    }

    .round-timer.warning .timer-digits {
      animation: timer-warn-pulse 0.9s ease-in-out infinite;
    }

    @keyframes timer-warn-pulse {
      0%, 100% { color: #2A275C; }
      50%       { color: #1a1840; }
    }

    .round-timer.expired .timer-digits {
      color: #7f1d1d;
      animation: pulse-danger 1s ease-in-out infinite;
    }

    @keyframes pulse-danger {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }

    /* ── Timer progress bar ── */
    .timer-progress-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: rgba(42,39,92,0.15);
      overflow: hidden;
    }
    .timer-progress-fill {
      position: absolute;
      top: 0; bottom: 0;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #1a1840, #2A275C);
      transition: width 0.25s linear, background 0.5s;
      overflow: hidden;
    }

    .timer-fill-left  { right: 50%; left: auto; }
    .timer-fill-right { left: 50%; right: auto; background: linear-gradient(270deg, #1a1840, #2A275C); }

    /* Sheen: left fill travels outward→center (left to right) */
    .timer-fill-left::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.30) 50%, transparent 75%);
      animation: shimmer-ltr 2s linear infinite;
    }

    /* Sheen: right fill travels outward→center (right to left) */
    .timer-fill-right::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.30) 50%, transparent 75%);
      animation: shimmer-rtl 2s linear infinite;
    }

    @keyframes shimmer-ltr {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    @keyframes shimmer-rtl {
      from { transform: translateX(100%); }
      to   { transform: translateX(-100%); }
    }
    .round-timer.warning .timer-fill-left  { background: linear-gradient(90deg,  #1a1840, #3730a3); }
    .round-timer.warning .timer-fill-right { background: linear-gradient(270deg, #1a1840, #3730a3); }
    .round-timer.expired .timer-fill-left,
    .round-timer.expired .timer-fill-right { background: #7f1d1d; }
  </style>
</head>
<body>
  <div class="overlay">

    <!-- Player 1 — left panel -->
    <div class="player-panel p1" id="panel1">
      <div class="panel-header">
        <div class="player-label">Player 1</div>
        <div class="player-name" id="name1">Player 1</div>
        <div class="name-divider"></div>
        <div class="wins-row">
          <div class="wins-label">Wins</div>
          <div class="win-pips">
            <div class="pip" id="p1w0"></div>
            <div class="pip" id="p1w1"></div>
          </div>
        </div>
      </div>
      <div class="panel-body"></div>
      <div class="winner-badge">✦ WINNER ✦</div>
      <div class="ladder" id="ladder1"></div>
    </div>

    <!-- Social ticker -->
    <div class="social-ticker">
      <div class="social-ticker-track">
        <!-- set A -->
        <span class="ticker-handle">
          <svg width="20" height="14" viewBox="0 0 20 14" fill="var(--parchment)"><path d="M19.6 2.2A2.5 2.5 0 0 0 17.8.4C16.3 0 10 0 10 0S3.7 0 2.2.4A2.5 2.5 0 0 0 .4 2.2C0 3.7 0 7 0 7s0 3.3.4 4.8a2.5 2.5 0 0 0 1.8 1.8C3.7 14 10 14 10 14s6.3 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8C20 10.3 20 7 20 7s0-3.3-.4-4.8zM8 10V4l5.2 3L8 10z"/></svg>
          @LoreSeekers.Almere
        </span>
        <span class="ticker-sep">✦</span>
        <span class="ticker-handle">
          <svg width="17" height="19" viewBox="0 0 20 22" fill="var(--parchment)"><path d="M2 0L0 4v14h5v3l3-3h4l6-6V0H2zm16 12l-4 4h-4l-3 3v-3H4V2h14v10zM9 5h2v5H9V5zm5 0h2v5h-2V5z"/></svg>
          loreseekersalmere
        </span>
        <span class="ticker-sep">✦</span>
        <span class="ticker-handle">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="var(--parchment)"><path d="M10 1.8c2.7 0 3 0 4.1.1 1 0 1.6.2 2 .4.4.2.8.5 1.1.8.4.4.6.7.8 1.2.2.4.4.9.4 2 .1 1 .1 1.3.1 4 0 2.7 0 3-.1 4.1 0 1-.2 1.6-.4 2-.2.4-.5.8-.8 1.2-.4.3-.7.5-1.2.8-.4.2-.9.3-2 .4-1 .1-1.3.1-4 .1-2.7 0-3 0-4.1-.1-1 0-1.6-.2-2-.4-.4-.2-.8-.5-1.2-.8-.3-.4-.5-.7-.8-1.2-.2-.4-.3-.9-.4-2C1.8 13 1.8 12.7 1.8 10c0-2.7 0-3 .1-4.1 0-1 .2-1.6.4-2 .2-.4.5-.8.8-1.2.4-.3.7-.5 1.2-.8.4-.2.9-.3 2-.4C7 1.8 7.3 1.8 10 1.8zM10 0C7.3 0 7 0 5.9.1 4.8.1 4 .3 3.3.6 2.6.9 2 1.2 1.4 1.8.8 2.4.5 3 .3 3.7.1 4.4 0 5.2 0 6.3 0 7.4 0 7.7 0 10.4s0 3 .1 4.1c.1 1.1.3 1.9.6 2.6.3.7.6 1.3 1.2 1.9.6.6 1.2.9 1.9 1.2.7.3 1.5.5 2.6.6 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c1.1-.1 1.9-.3 2.6-.6.7-.3 1.3-.6 1.9-1.2.6-.6.9-1.2 1.2-1.9.3-.7.5-1.5.6-2.6.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.1-1.1-.3-1.9-.6-2.6C19.1 2.6 18.8 2 18.2 1.4 17.6.8 17 .5 16.3.3 15.6.1 14.8 0 13.7 0 12.6 0 12.3 0 10 0zm0 4.9a5.1 5.1 0 1 0 0 10.2A5.1 5.1 0 0 0 10 4.9zm0 8.4a3.3 3.3 0 1 1 0-6.6 3.3 3.3 0 0 1 0 6.6zm5.3-9.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>
          loreseekers.almere
        </span>
        <span class="ticker-sep">✦</span>
        <!-- set B (duplicate for seamless loop) -->
        <span class="ticker-handle">
          <svg width="20" height="14" viewBox="0 0 20 14" fill="var(--parchment)"><path d="M19.6 2.2A2.5 2.5 0 0 0 17.8.4C16.3 0 10 0 10 0S3.7 0 2.2.4A2.5 2.5 0 0 0 .4 2.2C0 3.7 0 7 0 7s0 3.3.4 4.8a2.5 2.5 0 0 0 1.8 1.8C3.7 14 10 14 10 14s6.3 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8C20 10.3 20 7 20 7s0-3.3-.4-4.8zM8 10V4l5.2 3L8 10z"/></svg>
          @LoreSeekers.Almere
        </span>
        <span class="ticker-sep">✦</span>
        <span class="ticker-handle">
          <svg width="17" height="19" viewBox="0 0 20 22" fill="var(--parchment)"><path d="M2 0L0 4v14h5v3l3-3h4l6-6V0H2zm16 12l-4 4h-4l-3 3h-3v-3H4V2h14v10zM9 5h2v5H9V5zm5 0h2v5h-2V5z"/></svg>
          loreseekersalmere
        </span>
        <span class="ticker-sep">✦</span>
        <span class="ticker-handle">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="var(--parchment)"><path d="M10 1.8c2.7 0 3 0 4.1.1 1 0 1.6.2 2 .4.4.2.8.5 1.1.8.4.4.6.7.8 1.2.2.4.4.9.4 2 .1 1 .1 1.3.1 4 0 2.7 0 3-.1 4.1 0 1-.2 1.6-.4 2-.2.4-.5.8-.8 1.2-.4.3-.7.5-1.2.8-.4.2-.9.3-2 .4-1 .1-1.3.1-4 .1-2.7 0-3 0-4.1-.1-1 0-1.6-.2-2-.4-.4-.2-.8-.5-1.2-.8-.3-.4-.5-.7-.8-1.2-.2-.4-.3-.9-.4-2C1.8 13 1.8 12.7 1.8 10c0-2.7 0-3 .1-4.1 0-1 .2-1.6.4-2 .2-.4.5-.8.8-1.2.4-.3.7-.5 1.2-.8.4-.2.9-.3 2-.4C7 1.8 7.3 1.8 10 1.8zM10 0C7.3 0 7 0 5.9.1 4.8.1 4 .3 3.3.6 2.6.9 2 1.2 1.4 1.8.8 2.4.5 3 .3 3.7.1 4.4 0 5.2 0 6.3 0 7.4 0 7.7 0 10.4s0 3 .1 4.1c.1 1.1.3 1.9.6 2.6.3.7.6 1.3 1.2 1.9.6.6 1.2.9 1.9 1.2.7.3 1.5.5 2.6.6 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c1.1-.1 1.9-.3 2.6-.6.7-.3 1.3-.6 1.9-1.2.6-.6.9-1.2 1.2-1.9.3-.7.5-1.5.6-2.6.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.1-1.1-.3-1.9-.6-2.6C19.1 2.6 18.8 2 18.2 1.4 17.6.8 17 .5 16.3.3 15.6.1 14.8 0 13.7 0 12.6 0 12.3 0 10 0zm0 4.9a5.1 5.1 0 1 0 0 10.2A5.1 5.1 0 0 0 10 4.9zm0 8.4a3.3 3.3 0 1 1 0-6.6 3.3 3.3 0 0 1 0 6.6zm5.3-9.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg>
          loreseekers.almere
        </span>
        <span class="ticker-sep">✦</span>

    </div>

    <!-- Venue tag -->
    <div class="venue-tag">Live from The Netherlands, Almere</div>

    <!-- Round Timer — center bottom -->
    <div class="round-timer hidden" id="roundTimer">
      <div class="timer-digits" id="timerDigits">10:00</div>
      <div class="timer-progress-wrap">
        <div class="timer-progress-fill timer-fill-left"  id="timerProgressLeft"></div>
        <div class="timer-progress-fill timer-fill-right" id="timerProgressRight"></div>
      </div>
    </div>

    <!-- Player 2 — right panel -->
    <div class="player-panel p2" id="panel2">
      <div class="panel-header">
        <div class="player-label">Player 2</div>
        <div class="player-name" id="name2">Player 2</div>
        <div class="name-divider"></div>
        <div class="wins-row">
          <div class="wins-label">Wins</div>
          <div class="win-pips">
            <div class="pip" id="p2w0"></div>
            <div class="pip" id="p2w1"></div>
          </div>
        </div>
      </div>
      <div class="panel-body"></div>
      <div class="winner-badge">✦ WINNER ✦</div>
      <div class="ladder" id="ladder2"></div>
    </div>

  </div>

  <script>
    // ── Lore-icon background pattern ──
    (function () {
      // Lore icons: actual PNG, floating upward like bubbles.
      // Each icon gets a unique CSS keyframe with its own x-position and sway baked in.

      function addPattern(panelId, seed0) {
        const panel = document.getElementById(panelId);
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        Object.assign(svg.style, {
          position: 'absolute', top: '0', left: '0',
          width: '100%', height: '100%',
          pointerEvents: 'none', overflow: 'hidden', zIndex: '0'
        });

        let s = seed0 >>> 0;
        const rand = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 0xFFFFFFFF; };

        let css = '';

        for (let i = 0; i < 18; i++) {
          const h     = 24 + rand() * 60;           // height 24–84 px
          const w     = h * 0.72;
          const baseX = rand() * 225;
          const swayX = (20 + rand() * 25) * (rand() < 0.5 ? 1 : -1); // ±20–45 px, random direction
          const dur   = 24 + rand() * 28;            // 24–52 s — very slow
          const delay = -(rand() * dur);             // pre-offset so they're spread out immediately
          const name  = `lf-${panelId}-${i}`;

          // Keyframe: rises with sinusoidal side-to-side sway; fades in then out
          css += `@keyframes ${name}{
            0%  {transform:translate(${baseX.toFixed(1)}px,1120px);opacity:0}
            15% {transform:translate(${(baseX+swayX*.5).toFixed(1)}px,952px);opacity:0.04}
            30% {transform:translate(${(baseX+swayX).toFixed(1)}px,784px);opacity:0.04}
            50% {transform:translate(${(baseX-swayX*.8).toFixed(1)}px,560px);opacity:0.04}
            65% {transform:translate(${(baseX-swayX).toFixed(1)}px,392px);opacity:0.04}
            80% {transform:translate(${(baseX+swayX*.5).toFixed(1)}px,224px);opacity:0.04}
            90% {transform:translate(${(baseX+swayX*.2).toFixed(1)}px,112px);opacity:0}
            100%{transform:translate(${baseX.toFixed(1)}px,-110px);opacity:0}
          }`;

          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.style.animation = `${name} ${dur.toFixed(1)}s linear ${delay.toFixed(1)}s infinite`;

          const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
          img.setAttribute('href', '/lore-icon.png');
          img.setAttribute('x', '0');
          img.setAttribute('y', '0');
          img.setAttribute('width',  w.toFixed(1));
          img.setAttribute('height', h.toFixed(1));
          img.style.filter = 'invert(1) sepia(0.6) hue-rotate(10deg) saturate(0.8)';
          img.style.mixBlendMode = 'screen';

          g.appendChild(img);
          svg.appendChild(g);
        }

        // Inject keyframes + respect reduced-motion preference
        const style = document.createElement('style');
        style.textContent = css +
          `@media(prefers-reduced-motion:reduce){[style*="lf-"]{animation:none!important}}`;
        document.head.appendChild(style);

        panel.insertBefore(svg, panel.firstChild);
      }

      addPattern('panel1', 0xDEADBEEF);
      addPattern('panel2', 0xCAFEBABE);
    })();

    for (const n of [1, 2]) {
      const ladder = document.getElementById(`ladder${n}`);
      for (let i = 0; i <= 20; i++) {
        const rung = document.createElement('div');
        rung.className = 'rung';
        rung.id = `rung${n}-${i}`;
        const num = document.createElement('span');
        num.className = 'rung-num';
        num.textContent = i;
        rung.appendChild(num);
        ladder.appendChild(rung);
      }
    }

    let prev = { player1: { lore: 0, wins: 0 }, player2: { lore: 0, wins: 0 } };
    let timerState = null;
    let timerRaf = null;
    let clockOffset = 0; // server clock minus local clock (ms)

    function connect() {
      const ws = new WebSocket(`ws://${location.host}`);
      ws.addEventListener('message', (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type !== 'state') return;
        if (msg.serverNow != null) clockOffset = msg.serverNow - Date.now();
        updatePlayer(1, msg.data.player1, prev.player1);
        updatePlayer(2, msg.data.player2, prev.player2);
        if (msg.data.timer) updateTimer(msg.data.timer);
        prev = JSON.parse(JSON.stringify(msg.data));
      });
      ws.addEventListener('close', () => setTimeout(connect, 1500));
    }
    connect();

    function updateTimer(t) {
      timerState = t;
      if (timerRaf) { cancelAnimationFrame(timerRaf); timerRaf = null; }
      renderTimer();
    }

    function renderTimer() {
      if (!timerState) return;
      const t = timerState;
      const el = document.getElementById('roundTimer');
      const digits = document.getElementById('timerDigits');
      const fillLeft  = document.getElementById('timerProgressLeft');
      const fillRight = document.getElementById('timerProgressRight');

      const ms = t.running ? Math.max(0, t.endsAt - Date.now() - clockOffset) : t.remainingMs;
      const totalSecs = Math.ceil(ms / 1000);
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      digits.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      const isHidden  = false;
      const isExpired = ms === 0;
      const isWarning = ms > 0 && ms <= 30000 && t.running;

      el.classList.toggle('hidden',  isHidden);
      el.classList.toggle('expired', isExpired && !isHidden);
      el.classList.toggle('warning', isWarning);

      if (fillLeft && fillRight && t.durationMs > 0) {
        const halfPct = (ms / t.durationMs * 50).toFixed(2) + '%';
        fillLeft.style.width  = halfPct;
        fillRight.style.width = halfPct;
      }

      if (t.running && ms > 0) {
        timerRaf = requestAnimationFrame(renderTimer);
      }
    }

    function fitName(el) {
      el.style.fontSize = '34px';
      while (el.scrollWidth > el.offsetWidth && parseFloat(el.style.fontSize) > 11) {
        el.style.fontSize = (parseFloat(el.style.fontSize) - 0.5) + 'px';
      }
    }

    function updatePlayer(n, data, old) {
      const nameEl = document.getElementById(`name${n}`);
      nameEl.textContent = data.name;
      fitName(nameEl);

      const isMax = data.lore >= 20;

      for (let i = 0; i <= 20; i++) {
        const rung = document.getElementById(`rung${n}-${i}`);
        const isCurrent = i === data.lore;
        const isPast    = i < data.lore;
        const nearWin   = i >= 15;

        rung.classList.toggle('past',     isPast && !isMax);
        rung.classList.toggle('current',  isCurrent);
        rung.classList.toggle('near-win', nearWin && (isCurrent || isPast) && !isMax);
        rung.classList.toggle('max',      isMax && (isCurrent || isPast));
      }

      if (old && data.lore !== old.lore) {
        const rung = document.getElementById(`rung${n}-${data.lore}`);
        const cls = data.lore > old.lore ? 'enter-up' : 'enter-down';
        rung.classList.remove('enter-up', 'enter-down');
        void rung.offsetWidth; // force reflow so animation restarts
        rung.classList.add(cls);
        setTimeout(() => rung.classList.remove(cls), 350);
      }

      for (let i = 0; i < 2; i++) {
        document.getElementById(`p${n}w${i}`).classList.toggle('filled', i < data.wins);
      }

      document.getElementById(`panel${n}`).classList.toggle('winner', isMax);
    }
  </script>
